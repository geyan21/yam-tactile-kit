<text x="72" y="590" font-size="24" font-weight="700">Nail addition: 0.4614 mm nominal</text>
<text x="644" y="583" font-size="22" font-weight="700">Top: 0.7264 mm above R1 datum</text>
<text x="644" y="612" font-size="18">Variable fitting base below that datum is additional.</text>
<path d="M38 638H1122" stroke="#a5b8b9"/>
<text x="40" y="675" font-size="20">Gold lines: 3 µm nominal Ni + 0.2 µm Au on each exposed contact face (6.4 µm total allowance).</text>
<text x="40" y="708" font-size="20">Both copper contact faces point toward the film. Keep adhesive out of the active electrical interfaces.</text>
<text x="40" y="741" font-size="20">TPU foil width 13 mm; cover and base width 14 mm; source insert width 15 mm. The notch stays open.</text>
<text x="40" y="774" font-size="20">Two foil necks exit each cover port. Seal static edges; inspect terminal retention and free-bend slack.</text>
<text x="40" y="807" font-size="18">Cure, adhesion, film thickness, preload, contact accuracy, 20 N response and bending life require physical tests.</text>
</g>
