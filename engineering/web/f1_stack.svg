<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="830" viewBox="0 0 1160 830" role="img" aria-labelledby="title desc">
<title id="title">F1 R4: exactly what makes the tactile sensor</title>
<desc id="desc">Two separate nail sensors and four TPU sensors use conductive pressure film between patterned row and column flex circuits, protected by retained silicone covers. Dimensions are nominal; diagram thickness is not to scale.</desc>
<rect width="1160" height="830" rx="18" fill="#f4f7f6"/>
<g font-family="Arial,sans-serif" fill="#17323a">
<text x="36" y="48" font-size="31" font-weight="700">F1 R4 · the tactile sensor is the film + two patterned flexes</text>
<text x="36" y="82" font-size="20">Section through an active contact window · nominal dimensions · not to scale · 0 physical specimens</text>
<text x="66" y="137" font-size="25" font-weight="700">CH0 / CH1 · one on each nail prong</text>
<text x="640" y="137" font-size="25" font-weight="700">CH2–CH5 · four TPU regions</text>
<text x="206" y="174" font-size="19">OBJECT CONTACT</text>
<text x="784" y="174" font-size="19">OBJECT CONTACT</text>
