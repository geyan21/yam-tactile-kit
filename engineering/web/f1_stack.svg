<text x="295" y="222">Silicone wear roof · 100 µm</text>
<text x="295" y="274">Upper ROW flex · 145 µm</text>
<text x="295" y="302" font-size="17">includes rear feeds + rear coverlay</text>
<text x="295" y="350" fill="white">Conductive pressure film</text>
<text x="295" y="375" fill="white">100 µm · actual sensing material</text>
<text x="295" y="421">Lower COLUMN flex · 60 µm</text>
<text x="295" y="444" font-size="17">25 µm PI + 35 µm copper</text>
<text x="295" y="483">Insulating mounting bond · 50 µm</text>
<text x="295" y="529">Original hard nail</text>
<text x="875" y="225">Silicone wear roof · 400 µm</text>
<text x="875" y="253" font-size="17">side skirts bond onto the fitting base</text>
<text x="875" y="299">Upper ROW flex · 60 µm</text>
