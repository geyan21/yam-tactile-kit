<text x="610" y="319" font-size="16"></text>
<text x="610" y="342" font-size="16">u / Hall X →</text>
<text x="610" y="365" font-size="16">v / Hall Y ↑</text>
<text x="610" y="388" font-size="16">Hall Z out of this view</text>
