<text x="610" y="181" font-size="16">R1/R2: 10 kΩ 0402</text>
<text x="610" y="204" font-size="16">J1: four solder wires</text>
<text x="610" y="227" font-size="16">A0 = A1 = GND → 0x0C</text>
<text x="610" y="250" font-size="16">Select one TCA9548A branch</text>
