<rect x="1028" y="302" width="250" height="148" rx="9" fill="white" stroke="#829aa7"/>
<text x="1044" y="333" font-size="21" font-weight="700">U1 · TCA9548APWR</text>
<text x="1044" y="363" font-size="17">TSSOP-24 · address 0x70</text>
<text x="1044" y="391" font-size="17">Enable one branch at a time.</text>
<text x="1044" y="419" font-size="17">RESET → GP6 / physical 9</text>
<text x="1032" y="482" font-size="17">SDA GP0 / 1 · SCL GP1 / 2</text>
<rect x="1028" y="520" width="250" height="128" rx="9" fill="#e0eddf" stroke="#829aa7"/>
<text x="1044" y="554" font-size="23" font-weight="700">RP2040 Pico</text>
<text x="1044" y="584" font-size="17">USB capture · I²C 100 kHz</text>
<text x="1044" y="614" font-size="17">No actuator commands</text>
<text x="44" y="631" font-size="17">8 separate hoses. Label both ends.</text>
<text x="44" y="660" font-size="17" font-weight="700">The back channel also bends.</text>
<text x="550" y="631" font-size="17">F1RD pins: 1 Vs · 2 GND · 5 SCL · 8 SDA</text>
<text x="550" y="660" font-size="16">3 analog out unused · 4 / 6 / 7 unconnected</text>
<rect x="24" y="740" width="426" height="204" rx="14" fill="#f0e5d1" stroke="#b2986e"/>
<text x="44" y="775" font-size="22" font-weight="700">ON THE TWO THIN NAIL PRONGS</text>
<text x="44" y="809" font-size="19">CH0 + CH1 · R1 N0 laminates</text>
<text x="44" y="840" font-size="17">Nominal addition: 0.4 mm; measure actual.</text>
<text x="44" y="873" font-size="17">100 kΩ across each cell at the nail joint.</text>
<text x="44" y="906" font-size="17">Keep joints off contact; retain the notch.</text>
<rect x="530" y="740" width="448" height="204" rx="14" fill="#e4edf2" stroke="#829aa7"/>
<text x="550" y="775" font-size="22" font-weight="700">JN → U2 ADS1115IDGSR · 3.3 V</text>
<text x="550" y="809" font-size="18">JN pins: 1 +3V3 · 2 CH0 · 3 +3V3 · 4 CH1</text>
<text x="550" y="840" font-size="17">A0 / A1: nail signals; 10 kΩ pulldowns.</text>
<text x="550" y="873" font-size="17">A2 / A3: filtered 3V0 / 3V3 supply checks.</text>
<text x="550" y="906" font-size="17">SDA GP2 / physical 4 · SCL GP3 / physical 5</text>
<path d="M450 835H525" stroke="#a57d40" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M978 835H990V632H1025" stroke="#416776" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1010" y="740" width="286" height="204" rx="14" fill="#e8eee2" stroke="#8eaa8b"/>
<text x="1032" y="775" font-size="22" font-weight="700">U3 · 3.0 V regulator</text>
<text x="1032" y="809" font-size="17">LP5907MFX-3.0/NOPB</text>
<text x="1032" y="840" font-size="17">USB VBUS → U3 → PS0–3 / U1</text>
<text x="1032" y="873" font-size="17">Pico 3V3 → nail cells / U2</text>
<text x="1032" y="906" font-size="17" font-weight="700">No 5 V bus pullups.</text>
<text x="36" y="990" font-size="20" font-weight="700">Pressure is a deformation signal. Calibrate with actual force; do not infer force as pressure × area.</text>
<text x="36" y="1028" font-size="18">Two bytes / 15-bit ELVR word · preserve signed pressure · keep missing data unavailable.</text>
<text x="36" y="1063" font-size="18">A common pressure rise can cancel in the differential signal. Verify contact, bending, temperature and hose effects.</text>
<text x="36" y="1110" font-size="18">Functional wiring illustration; use checked CAD/PCB files and the assembly guide. 0 physical specimens · 20 N is a target.</text>
</g></svg>
