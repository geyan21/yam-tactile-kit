<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1160" role="img" aria-labelledby="title desc">
<title id="title">P1 exact sensor placement, eight hoses and two nail cells</title>
<desc id="desc">Four front/back air-channel pairs in the soft insert connect to four remote ELVR differential sensors. Front goes to B high, back to A low. A TCA9548A multiplexer connects them to Pico GP0 and GP1. Two thin R1 nail cells connect to an ADS1115 on GP2 and GP3. Pressure electronics use 3 volts; Pico and nail ADC use 3.3 volts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#416776"/></marker></defs>
<rect width="1320" height="1160" fill="#f7f9f5"/>
<g font-family="sans-serif" fill="#203e47">
<text x="36" y="44" font-size="30" font-weight="700">P1 · the soft finger contains air channels; the pressure chips stay at the wrist</text>
<text x="36" y="78" font-size="18">4 × ELVR-L30D-F1RD-C-NI3H + 2 × retained R1 N0 nail cells · experimental bench design</text>
<rect x="24" y="112" width="426" height="578" rx="14" fill="#e7eee1" stroke="#91a48a"/>
<rect x="530" y="112" width="448" height="578" rx="14" fill="#e4edf2" stroke="#829aa7"/>
<rect x="1010" y="112" width="286" height="578" rx="14" fill="#e9edf0" stroke="#829aa7"/>
<text x="44" y="146" font-size="21" font-weight="700">IN THE REPLACEMENT SOFT INSERT</text>
<text x="550" y="146" font-size="21" font-weight="700">ON THE REMOTE READOUT PCB</text>
<text x="1032" y="146" font-size="21" font-weight="700">DIGITAL READOUT</text>
<text x="44" y="177" font-size="16">No rigid pressure chip on the contact face.</text>
<text x="550" y="177" font-size="16">All four sensors: 3.0 V · I²C 0x78</text>
<g font-size="18">
