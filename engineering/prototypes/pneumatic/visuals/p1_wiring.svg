<text x="66" y="240" fill="#286f91">Front channel</text><text x="66" y="269" fill="#7a5895">Back channel</text>
<path d="M236 234H544" stroke="#286f91" stroke-width="4"/><path d="M236 263H544" stroke="#7a5895" stroke-width="4"/>
<rect x="546" y="202" width="414" height="80" rx="8" fill="white" stroke="#809aaa"/>
<text x="560" y="239" fill="#286f91">B high</text><text x="560" y="269" fill="#7a5895">A low</text><text x="690" y="234" font-size="23" font-weight="700">PS0 → CH2</text><text x="690" y="262" font-size="16">Mux branch 0</text>
<text x="44" y="315" font-weight="700">CH3 · middle-distal</text>
<text x="66" y="345" fill="#286f91">Front channel</text><text x="66" y="374" fill="#7a5895">Back channel</text>
<path d="M236 339H544" stroke="#286f91" stroke-width="4"/><path d="M236 368H544" stroke="#7a5895" stroke-width="4"/>
