<text x="506" y="140" font-size="22" font-weight="bold">J1 power leads</text>
<text x="506" y="170" font-size="18">Pin 1 (left, square land): +5 V</text>
<text x="506" y="197" font-size="18">Pin 2 (right): GND</text>
<text x="506" y="240" font-size="22" font-weight="bold">D1–D4: APT2012QBC/D</text>
<text x="506" y="270" font-size="18">Pin 1 / cathode is LEFT on all four.</text>
<text x="506" y="297" font-size="18">Pin 2 / anode is RIGHT on all four.</text>
<text x="506" y="340" font-size="22" font-weight="bold">R1–R4: 220 Ω each</text>
<text x="506" y="370" font-size="18">Use 1206, 1%, at least 0.25 W.</text>
<text x="506" y="397" font-size="18">R1/R3 left and R2/R4 lower pad = +5 V.</text>
<text x="506" y="440" font-size="22" font-weight="bold">Assembly</text>
<text x="506" y="470" font-size="18">Use the carrier's four short edge lips.</text>
<text x="506" y="497" font-size="18">Keep the lens hole and moving barrel clear.</text>
<text x="32" y="571" font-size="18">Land geometry and wiring follow the native KiCad board; use its Gerbers/drills for fabrication.</text>
