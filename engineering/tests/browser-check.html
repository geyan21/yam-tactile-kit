<!doctype html><html lang="en"><meta charset="utf-8"><title>Engineering website functional check</title>
<body><iframe id="page" src="index.html" title="Website under test" style="width:1180px;height:900px"></iframe><pre id="qa-results">pending</pre>
<script>
/* Local functional tests. No test fixture is published as hardware evidence. */
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
document.getElementById("page").addEventListener("load",async()=>{
  const checks=[],observations={};const check=(name,value)=>checks.push({name,passed:Boolean(value)});
  try{
    await pause(800);
    const frame=document.getElementById("page"),w=frame.contentWindow,d=w.document;
    check("real mesh assembly renders",Number(d.getElementById("cad").dataset.faces)>10000);
    check("all R1, L1 and B1 STEP/STL links present",d.querySelectorAll("#parts-table a").length===56);
    check("current designs and two new concepts listed separately",d.querySelectorAll("#candidate-table tr").length===7);
    check("scalability study is reachable",d.querySelector('a[href="architecture.html"]')!==null);
    const before=w.EngineeringUI.viewer.yaw;
    d.getElementById("cad").dispatchEvent(new w.KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true}));
    await pause(100);check("keyboard rotates actual mesh",w.EngineeringUI.viewer.yaw!==before);
    const layer=d.querySelector('[data-layer="frame"]'),count=Number(d.getElementById("cad").dataset.faces);
    layer.click();await pause(120);check("layer toggle removes frame geometry",Number(d.getElementById("cad").dataset.faces)<count);
    layer.click();
    const select=d.getElementById("model-select");
    // Headless virtual time can coalesce animation frames while timers advance.
    // Render the selected model synchronously for geometry checks, then inspect
    // separate normal-load screenshots as well.
    function inspect(id){
      select.value=id;select.dispatchEvent(new w.Event("change"));w.EngineeringUI.viewer.draw();
      const expected=w.EngineeringUI.viewer.model.components.reduce((total,part)=>total+part.faces.length,0);
      return d.getElementById("cad").dataset.renderedModel===id&&Number(d.getElementById("cad").dataset.faces)===expected;
    }
    check("actual mold CAD renders",inspect("nail_cover_mold"));
    const l1Rendered=inspect("l1_assembly");
    observations.l1_assembly={canvasModel:d.getElementById("cad").dataset.model,faces:Number(d.getElementById("cad").dataset.faces),
      expectedFaces:w.EngineeringUI.viewer.model.components.reduce((total,part)=>total+part.faces.length,0),
      groups:[...w.EngineeringUI.viewer.visible]};
    check("L1 assembled finger and cell render",l1Rendered);
    check("L1-specific layer controls and explosion enabled",d.querySelector('[data-layer="fixed"]')&&d.querySelector('[data-layer="cell"]')&&!d.getElementById("explode").disabled);
    const benchRendered=inspect("l1_bench");
    observations.l1_bench={canvasModel:d.getElementById("cad").dataset.model,faces:Number(d.getElementById("cad").dataset.faces),
      expectedFaces:w.EngineeringUI.viewer.model.components.reduce((total,part)=>total+part.faces.length,0)};
    check("L1 physical test fixture renders",benchRendered);
    check("B1 actual compliant insert assembly renders",inspect("b1_assembly"));
    check("B1 fixed and moving components are separate layers",d.querySelector('[data-layer="spine"]')&&d.querySelector('[data-layer="b1tpu"]')&&d.querySelector('[data-layer="magnet"]')&&d.querySelector('[data-layer="pcb"]'));
    check("B1 fabrication and build guide reachable",d.querySelector('a[href="downloads/b1_head_fabrication.zip"]')&&d.querySelector('a[href="build-b1.html"]'));
    const force=d.getElementById("load-force"),moment=d.getElementById("load-moment-value").textContent;
    force.value="10";force.dispatchEvent(new w.Event("input"));
    check("load explorer responds to applied force",d.getElementById("load-moment-value").textContent!==moment&&d.getElementById("load-force-value").textContent==="10.0 N");
    check("performance plot initially empty",d.querySelectorAll("#result-plot circle").length===0);
    let rejected=false;
    try{w.EngineeringUI.renderReport({schema:"yam-calibration/1",evidence_kind:"synthetic",channels:[]});}catch(_){rejected=true;}
    check("synthetic report is rejected",rejected);
    let l1Rejected=false;
    try{w.EngineeringUI.renderReport({schema:"yam-l1-finger-validation/1",evidence_kind:"synthetic",predictions:[]});}catch(_){l1Rejected=true;}
    check("synthetic L1 report is rejected",l1Rejected);
    frame.style.width="390px";await pause(180);
    check("mobile page has no horizontal overflow",d.documentElement.scrollWidth<=w.innerWidth+1);
    check("20 N requirement visible",d.body.innerText.includes("20 N per finger"));
    check("PDF cut sheet reachable",d.querySelector('a[href="downloads/r1_cut_sheet.pdf"]')!==null);
    check("L1 drawings and test plans reachable",d.querySelector('a[href="downloads/l1_review_drawings.pdf"]')&&d.querySelector('a[href="downloads/l1_finger_plan.json"]'));
    // Invented inputs exercise the report renderer only. They are never
    // stored as physical experiment files or loaded into the public homepage.
    w.EngineeringUI.renderReport({schema:"yam-l1-finger-validation/1",evidence_kind:"physical",
      predictions:[{contact_id:"SOFTWARE-ONLY",reference_n:0,predicted_n:-.1},
                   {contact_id:"SOFTWARE-ONLY",reference_n:20,predicted_n:20.1}]},"software test fixture — no hardware evidence");
    check("L1 measured-report format renders using software-only inputs",d.querySelectorAll("#result-plot circle").length===2);
    check("negative zero error is visible within plot",Array.from(d.querySelectorAll("#result-plot circle")).every(dot=>Number(dot.getAttribute("cy"))<=305));
    let contactRejected=false;
    try{w.EngineeringUI.renderReport({schema:"yam-contact-validation/1",evidence_kind:"synthetic",regions:[]});}catch(_){contactRejected=true;}
    check("synthetic contact report is rejected",contactRejected);
    const metric={trials:20,observed_errors:0,unavailable_trials:0,conservative_errors:0,conservative_error_rate:0,upper_error_bound_95:.139108433};
    w.EngineeringUI.renderReport({schema:"yam-contact-validation/1",evidence_kind:"physical",
      planned_trials:40,recorded_trials:40,plan_complete:true,observed_rate_screen_met:true,per_metric_95_bound_below_1pct:false,
      regions:[{region_id:"SOFTWARE_ONLY",loaded:metric,clear:metric}]},"software test fixture — no hardware evidence");
    check("contact report format renders rates and uncertainty",d.getElementById("result-plot").dataset.reportKind==="contact"&&d.querySelectorAll("#result-plot circle").length===2);
    check("contact pilot does not display reliability as established",d.getElementById("result-metrics").textContent.includes("not established"));
    check("contact guide is reachable",d.querySelector('a[href="contact.html"]')!==null);
  }catch(error){checks.push({name:error.stack||error.message,passed:false});}
  document.getElementById("qa-results").textContent=JSON.stringify({passed:checks.every(item=>item.passed),checks,observations});
});
</script></body></html>
